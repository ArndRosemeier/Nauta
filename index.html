<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nauta</title>
    <!-- A web app on tablets: the whole screen, no zoom, no rubber-band scrolling (docs/design/nauta-plan.md, Tablets). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nauta" />
    <meta name="theme-color" content="#0b1a2a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a2a; overscroll-behavior: none; }
      body { font: 14px/1.4 system-ui, sans-serif; color: #e8eef4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); margin: 0; white-space: pre; font: 12px/1.35 ui-monospace, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; display: none; }
      #loading, #failed { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1a2a; transition: opacity 0.6s; }
      #loading h1 { font: 300 44px/1 Georgia, serif; letter-spacing: 0.35em; margin: 0 0 0 0.35em; }
      #failed { display: none; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <pre id="hud"></pre>
    <div id="loading"><h1>NAUTA</h1></div>
    <div id="failed"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
