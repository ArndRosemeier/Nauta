<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nauta</title>
    <!-- A web app on tablets: the whole screen, no zoom, no rubber-band scrolling (docs/design/nauta-plan.md, Tablets). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nauta" />
    <meta name="theme-color" content="#0b1a2a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a2a; overscroll-behavior: none; }
      body { font: 14px/1.4 system-ui, sans-serif; color: #e8eef4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); margin: 0; white-space: pre; font: 12px/1.35 ui-monospace, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; display: none; }
      #loading, #failed { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1a2a; transition: opacity 0.6s; }
      #loading h1 { font: 300 44px/1 Georgia, serif; letter-spacing: 0.35em; margin: 0 0 0 0.35em; }
      #failed { display: none; padding: 24px; text-align: center; }
      /* ?probe: the report scrolls and can be selected, the buttons fit a finger. */
      #probe { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left)); }
      #probe header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      #probe h1 { font: 300 22px/1 Georgia, serif; letter-spacing: 0.2em; margin: 0 12px 0 0; }
      #probe button { font: inherit; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #5a7894; background: #18324a; color: inherit; }
      #probe button:disabled { opacity: 0.4; }
      #probe pre { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
      /* The version and what's new (src/app/whatsNew.ts): a quiet corner button a finger can hit, its panel over the view. */
      #version { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #ffffff33; background: #0b1a2a99; color: #e8eef4cc; font: 13px/1 system-ui, sans-serif; touch-action: manipulation; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
      #version.fresh::after { content: ''; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: #f2c14e; vertical-align: 1px; }
      .whatsnew-backdrop { position: fixed; inset: 0; display: grid; place-items: center; background: #00000080; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); touch-action: pan-y; }
      .whatsnew-panel { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; background: #0f2236f2; border: 1px solid #5a789466; border-radius: 14px; box-shadow: 0 12px 40px #0008; overflow: hidden; }
      .whatsnew-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 20px; border-bottom: 1px solid #5a789444; }
      .whatsnew-head h2 { font: 300 22px/1 Georgia, serif; letter-spacing: 0.08em; margin: 0; }
      .whatsnew-close { width: 44px; height: 44px; border: 0; background: none; color: inherit; font: 20px/1 system-ui, sans-serif; touch-action: manipulation; }
      .whatsnew-list { overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 20px 16px; -webkit-user-select: text; user-select: text; }
      .whatsnew-release h3 { font: 600 15px/1.2 system-ui, sans-serif; margin: 16px 0 6px; }
      .whatsnew-release.current h3 { color: #f2c14e; }
      .whatsnew-date { font-weight: 400; opacity: 0.6; margin-left: 10px; }
      .whatsnew-release ul { margin: 0; padding-left: 20px; }
      .whatsnew-release li { margin: 3px 0; }
      /* ?slice: where to stand on her (src/app/standpointBar.ts), buttons a finger can hit, clear of the version button. */
      #standpoints { position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); right: 140px; display: flex; flex-wrap: wrap; gap: 8px; }
      #standpoints button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #ffffff33; background: #0b1a2a99; color: #e8eef4; font: 14px/1 system-ui, sans-serif; touch-action: manipulation; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
      #standpoints button.on { border-color: #f2c14e; color: #f2c14e; }
      /* ?bench (src/app/benchRun.ts): the frame times and memory, large enough to read off a tablet, clear of the HUD. */
      #bench { position: fixed; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); max-width: calc(100% - 20px); display: none; margin: 0; padding: 10px 14px; border-radius: 10px; background: #0b1a2acc; white-space: pre-wrap; font: 15px/1.45 ui-monospace, monospace; -webkit-user-select: text; user-select: text; }
      #bench button { margin-top: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #f2c14e; background: none; color: #f2c14e; font: 14px/1 system-ui, sans-serif; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <pre id="hud"></pre>
    <pre id="bench"></pre>
    <button id="version" type="button"></button>
    <div id="loading"><h1>NAUTA</h1></div>
    <div id="failed"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
