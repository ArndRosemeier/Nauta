name: Pages

# The game, playable at https://arndrosemeier.github.io/Nauta/ after every push to main.
# A push that changes only these paths changes nothing on the page, so it is no build and gets no version number:
# keep this list equal to NOT_A_BUILD in tools/version/version.ts (test/version.test.ts holds them together).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The whole history: the version is the count of builds on main (tools/version/version.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The crew's character pack (plan N4.0): the Actors release's archive is downloaded once per version and kept.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/actors
          key: actors-packs-${{ hashFiles('package-lock.json') }}
      - run: npm run packs
      - run: npm run build
        env:
          VITE_BASE: /Nauta/
          # The deploy's build: it must know its version and every note must belong to a build.
          NAUTA_RELEASE: '1'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
