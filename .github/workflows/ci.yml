name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs side by side; every step has a time limit (docs/CHECKS.md).
jobs:
  test:
    name: Tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests and guards (70 s at most)
        run: timeout 70 npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  # The one status that says CI passed.
  check:
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        run: test "${{ needs.test.result }}" = success && test "${{ needs.build.result }}" = success
