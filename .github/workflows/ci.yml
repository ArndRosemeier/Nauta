name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs side by side; every step has a time limit (docs/CHECKS.md).
jobs:
  test:
    name: Tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner holds the budgets itself (tools/test/budgets.json): a slow test, file or suite fails here as on a desk.
      - name: Tests, guards and the duplication ratchet
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The whole history, so the build knows its version (tools/version/version.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  # The slow checks (docs/CHECKS.md), in jobs side by side, each with its own 10 minutes: each check under its own
  # budget, each job's checks together within two thirds of its 10 minutes. A new check goes where there is more room.
  slow:
    name: "Slow checks: the start, the sea and the simulation"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every budgeted step adds its time to BUDGET_LOG; the last step sums them against the job's 10 minutes.
      - name: The job's start and the budget log
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUDGET_LOG=$RUNNER_TEMP/budget.log" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/slow-setup
      # Browser checks, each on its own page load (docs/CHECKS.md, "Browser checks: the rule").
      # SHOT_TIMEOUT: a page that never gets ready fails inside the step's 3 minutes.
      - name: The game starts and draws in a browser (desktop, and a dragged tablet view)
        env:
          SHOT_TIMEOUT: 170000
        run: node tools/guards/budget.mjs 120 180 -- npm run check:shots -- shots start
      - name: The sea from her quarterdeck at every time of day and in every sea
        env:
          SHOT_TIMEOUT: 170000
        run: node tools/guards/budget.mjs 120 180 -- npm run check:shots -- shots sea
      - name: The same orders give the same state after ten simulated minutes, in two processes and through bytes
        run: node tools/guards/budget.mjs 120 180 -- npm run check:replay
      - name: The brig sails, tacks and heels within her limits in every wind, through the sea and the gusts
        run: node tools/guards/budget.mjs 120 180 -- npm run check:sailing
      - name: The crew carries out every order to the end, sets plain sail sail by sail, and two busy crews fit 16 KB a state (N4.1)
        run: node tools/guards/budget.mjs 120 180 -- npm run check:crew
      - name: The captain walks every space, door and ladder of the brig in the strongest duel sea (N2.3)
        run: node tools/guards/budget.mjs 120 180 -- npm run walk:check
      - name: Round shot fired as they bear strikes a brig about as often as the design says at 100, 200 and 400 m (N5.2)
        run: node tools/guards/budget.mjs 120 180 -- npm run check:gunnery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
      - name: All slow checks together within the job's 10 minutes
        if: always()
        run: node tools/guards/budget.mjs --sum 600

  slow-brig:
    name: "Slow checks: the brig in a browser"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every budgeted step adds its time to BUDGET_LOG; the last step sums them against the job's 10 minutes.
      - name: The job's start and the budget log
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUDGET_LOG=$RUNNER_TEMP/budget.log" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/slow-setup
      - name: The ship and the water together, under way (N2.5)
        run: node tools/guards/budget.mjs 120 180 -- npm run check:ship
      - name: The sails set, on every point of sail, through a tack, taken in; the far ship's (N3.10)
        env:
          SHOT_TIMEOUT: 170000
        run: node tools/guards/budget.mjs 120 180 -- npm run shot:sails -- shots/sails
      - name: Two headless browsers play one match through a GameHub stand-in, and the guest takes over when the host leaves (N3.7)
        timeout-minutes: 3
        run: node tools/guards/budget.mjs 60 120 -- npm run check:room
      - name: The game installs for use without a network, starts offline, updates by fetching only what changed, refuses wrong bytes (N7.6)
        timeout-minutes: 3
        env:
          SHOT_TIMEOUT: 120000
        run: node tools/guards/budget.mjs 90 150 -- npm run check:offline
      # A server outside our hands: the check gives a connection that fails one more try, and stops within its 3 minutes.
      - name: The same against the live GameHub, with the game's own app key (N3.7)
        timeout-minutes: 3
        env:
          GAMEHUB_URL: https://games.futuremagic.de
        run: node tools/guards/budget.mjs 60 120 -- npm run check:room
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-brig
          path: shots
      - name: All slow checks together within the job's 10 minutes
        if: always()
        run: node tools/guards/budget.mjs --sum 600

  # Computer captains fighting whole duels (N7.1): a job of its own, as the check fights a duel on every core.
  slow-captains:
    name: "Slow checks: computer captains fight duels"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The job's start and the budget log
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUDGET_LOG=$RUNNER_TEMP/budget.log" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Computer captains fight duels to the end; each closes, fires and strikes when beaten, and no order of his is refused (N7.1)
        run: node tools/guards/budget.mjs 120 180 -- npm run check:captains
      - name: A novice plays the first match doing only what the first lieutenant asks; every lesson comes and is done (N7.4)
        run: node tools/guards/budget.mjs 120 180 -- npm run check:first
      # npm test runs its files in shards, several files to a process (docs/CHECKS.md): in this job every file runs alone
      # as well, so a test that leans on another file's leftovers fails.
      - name: npm test, each file in its own process
        run: node tools/guards/budget.mjs 120 180 -- npm test -- --isolated
      - name: All slow checks together within the job's 10 minutes
        if: always()
        run: node tools/guards/budget.mjs --sum 600

  # The one status that says CI passed.
  check:
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        run: test "${{ needs.test.result }}" = success && test "${{ needs.build.result }}" = success
